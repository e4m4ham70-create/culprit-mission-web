<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>용의자 카드 | 범인찾기 미션</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">FIND THE CULPRIT</p>
      <h1>🕵️ 용의자 카드</h1>
      <p class="hero-text">
        14명의 친구 정보를 살펴보고, 조원들이 찾은 단서와 비교하여 범인을 추리해 보세요.
      </p>
    </section>

    <section class="card">
      <h2>&lt; 용의자 확인 방법 &gt;</h2>
      <ol class="steps">
        <li>각자 맡은 힌트의 영어 증언을 해석합니다.</li>
        <li>조원들과 핵심 단서를 공유합니다.</li>
        <li>아래 용의자 카드의 정보와 단서를 비교합니다.</li>
        <li>범인이라고 생각되는 학생을 정한 뒤 선생님께 확인받습니다.</li>
      </ol>
    </section>

    <section class="card">
      <h2>용의자 14명</h2>

      <div class="suspect-grid">
        <figure class="suspect-card"><img src="assets/suspects/oh-taeil.png" alt="오태일 용의자 카드"><figcaption>오태일</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/bang-yerin.png" alt="방예린 용의자 카드"><figcaption>방예린</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/nam-suho.png" alt="남수호 용의자 카드"><figcaption>남수호</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/kang-wooju.png" alt="강우주 용의자 카드"><figcaption>강우주</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/yoo-doha.png" alt="유도하 용의자 카드"><figcaption>유도하</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/kim-ari.png" alt="김아리 용의자 카드"><figcaption>김아리</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/anna-young.png" alt="안나영 용의자 카드"><figcaption>안나영</figcaption></figure>

        <figure class="suspect-card"><img src="assets/suspects/lee-rahel.png" alt="이라헬 용의자 카드"><figcaption>이라헬</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/hwang-chanhee.png" alt="황찬희 용의자 카드"><figcaption>황찬희</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/hong-suyeon.png" alt="홍수연 용의자 카드"><figcaption>홍수연</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/seo-yooni.png" alt="서윤이 용의자 카드"><figcaption>서윤이</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/hayoon.png" alt="하윤 용의자 카드"><figcaption>하윤</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/kim-woori.png" alt="김우리 용의자 카드"><figcaption>김우리</figcaption></figure>
        <figure class="suspect-card"><img src="assets/suspects/choi-somi.png" alt="최솜이 용의자 카드"><figcaption>최솜이</figcaption></figure>
      </div>
    </section>

    <div class="finish">
      조원들과 단서를 모두 비교했다면 범인을 한 명으로 좁혀 보세요.
    </div>

    <a class="back-link" href="index.html">← 처음 화면으로</a>
  </main>

</html>
